<script>
(function(){
  var el=document.getElementById('lbar'), pc=document.getElementById('lpct'),
      ring=document.getElementById('lring'), p=0;
  /* the splash page's only job is to look good, then hand off */
  var t=setInterval(function(){
    p=Math.min(p+Math.random()*11+4,100);
    el.style.width=p+'%'; pc.textContent=Math.round(p)+'%';
    ring.style.strokeDashoffset=502-502*p/100;
    if(p>=100){clearInterval(t);setTimeout(go,260);}
  },110);
  function go(){
    var l=document.getElementById('loader'); l.classList.add('gone');
    setTimeout(function(){location.replace('index.html');},620);
  }
  setTimeout(go,2600);
  /* petals */
  var L=document.getElementById('petals');
  for(var i=0;i<14;i++){var d=document.createElement('i');var s=6+Math.random()*7;
    d.style.left=(Math.random()*100)+'vw';d.style.width=d.style.height=s+'px';
    d.style.opacity=(0.15+Math.random()*0.3).toFixed(2);
    d.style.animationDuration=(12+Math.random()*12)+'s';d.style.animationDelay=(-Math.random()*20)+'s';
    L.appendChild(d);}
})();
